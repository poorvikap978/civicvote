{% extends 'base.html' %}
{% block title %}Admin Login — CivicVote{% endblock %}
{% block content %}
<div style="max-width:400px; margin:80px auto;">
    <div style="text-align:center; margin-bottom:32px;">
        <div style="font-size:3rem;">🔐</div>
        <h2 style="font-family:var(--display); font-size:1.8rem; margin-top:12px;">Admin Login</h2>
        <p style="color:var(--muted); margin-top:6px; font-size:0.88rem;">Election Commission Portal</p>
    </div>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button class="btn btn-primary" style="width:100%;">Login</button>
        </form>
    </div>
    <p style="text-align:center; color:var(--muted); font-size:0.8rem; margin-top:16px;">
        Default: admin / admin123
    </p>
</div>
{% endblock %}
